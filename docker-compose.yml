services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      # 常驻 worker 数量（按需扩容，上限 WORKER_POOL_MAX）
      # 每个 worker 约 30~130MB（用到 pandas 的脚本会涨到 130MB 左右）
      - WORKER_POOL_SIZE=2
      - WORKER_POOL_MAX=6
      # 运行时数据（份额历史 / K线缓存 / 自选 ETF 配置）落到持久卷，
      # 否则每次 --build 重建容器都会清零，份额分位永远补不出来。
      - ETF_DATA_DIR=/app/data
    volumes:
      - etf-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:5000"
    depends_on:
      - backend
    restart: always
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:3000

volumes:
  etf-data:
